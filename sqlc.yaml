# sqlc: typed Go wrappers for the hand-written SQL in internal/store/queries.
# The goose migrations are the schema (sqlc reads only their "+goose Up" parts).
# Regenerate with `make generate`; `make check` fails if the output is stale.
version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlcgen
        out: internal/store/sqlcgen
        sql_package: pgx/v5
        # Nullable columns become pointers (*string for tasks.error) instead of pgtype wrappers.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
