# Local development stack.
#
# All settings come from .env (git-ignored); there are no defaults here.
# `make` creates .env from .env.template on first run; for plain
# docker compose: cp .env.template .env
# The `tests`, `lint` and `sqlc` services are behind profiles, so `docker compose up`
# never starts them; the Makefile runs them.

name: tenant-service

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Published for desktop clients (DBeaver, psql) on 127.0.0.1:6432, not 5432,
    # so it doesn't clash with a Postgres already on the host. Override with
    # POSTGRES_HOST_PORT. The services themselves use the compose network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      # postgres:18+ keeps data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level up from the pre-18 location.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    # RabbitMQ names its node (and its data directory) after the hostname;
    # a fixed hostname keeps messages and queues across container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # Only the management UI / HTTP API is published (used by scripts/publish-update.sh);
    # AMQP (5672) stays on the compose network. Bound to localhost only.
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # `ping` passes before the AMQP listener is up; port connectivity does not.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # HTTP API, outbox relay and update consumer (DESIGN.md §2). Migrations run on start.
  controlplane:
    build: .
    image: tenant-service:local
    command: ["controlplane"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      HTTP_ADDR: ":8080"
      GIN_MODE: release
    # Bound to localhost only; override the host port with API_HOST_PORT.
    ports:
      - "127.0.0.1:${API_HOST_PORT}:8080"
    healthcheck:
      # busybox wget from the alpine base image (DESIGN.md §10).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # The provisioning simulator (DESIGN.md §8). Same image as the control plane.
  # Its behavior comes from WORKER_ARGS, so `make worker ARGS="--fail-rate=1"`
  # replaces it with a differently-configured one (never a second one).
  worker:
    build: .
    image: tenant-service:local
    command: worker ${WORKER_ARGS}
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Runs the Go test suite, so the host needs no Go toolchain. Debian-based image,
  # not -alpine: -race needs cgo and a C toolchain.
  # Isolation from the dev stack: its own database and its own RabbitMQ vhost,
  # both created fresh and dropped by `make test` (DESIGN.md §10). The names here
  # must match TEST_DB / TEST_VHOST in the Makefile.
  tests:
    image: golang:1.27
    profiles: [test]
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/controlplane_test?sslmode=disable
      TEST_AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/test
      # Management API: testutil.NewVhost creates a vhost per test through it.
      TEST_RABBITMQ_API_URL: http://rabbitmq:15672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Lint and format (`make lint`, `make fmt`, `make fmt-check`). Pinned, so every
  # machine gets the same rules and formatter output. Shares the Go caches above.
  lint:
    image: golangci/golangci-lint:v2.14.0
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - golangci-lint-cache:/root/.cache/golangci-lint

  # Static analysis for the shell scripts (`make lint`).
  shellcheck:
    image: koalaman/shellcheck:v0.11.0
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src:ro

  # sqlc code generation (`make generate`) and its staleness check (`make sqlc-check`).
  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: [tools]
    working_dir: /src
    volumes:
      - .:/src

volumes:
  postgres-data:
  rabbitmq-data:
  go-mod-cache:
  go-build-cache:
  golangci-lint-cache:
